[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-city-air-quality"
version = "0.1.0"
description = "Reproduction of four regression models for hourly PM2.5 prediction"
requires-python = ">=3.10"
dependencies = [
  "joblib>=1.3",
  "numpy>=1.24",
  "pandas>=2.0",
  "requests>=2.31",
  "scikit-learn>=1.3",
]

[project.scripts]
air-quality = "air_quality:main"

[tool.setuptools]
py-modules = ["air_quality"]

